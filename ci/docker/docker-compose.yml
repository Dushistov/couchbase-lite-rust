version: "3.9"
services:
  lite-core-cbs:
    build:
      context: ./cbs
      args:
        - COUCHBASE_VERSION=${COUCHBASE_VERSION:-6.6.0}
    ports:
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "8094:8094"
      - "11207:11207"
      - "11210:11210"
      - "11211:11211"
      - "18091:18091"
      - "18092:18092"
      - "18093:18093"
      - "18094:18094"

  lite-core-sg:
    profiles:
      - collections
    build:
      context: ./sg
      args:
        - SG_VERSION=${SG_VERSION:-3.0.9}
        - SG_DEB_ARM64=${SG_DEB_ARM64:-}
        - SG_DEB_AMD64=${SG_DEB_AMD64:-}
        - SSL=${SSL:-true}
    ports:
      - "4984:4984"
      - "4985:4985"
    depends_on:
      - "lite-core-cbs"

  lite-core-sg-legacy:
    build:
      context: ./sg
      args:
        - SG_VERSION=${SG_VERSION:-3.0.9}
        - SG_DEB_ARM64=${SG_LEGACY_DEB_ARM64:-}
        - SG_DEB_AMD64=${SG_LEGACY_DEB_AMD64:-}
        - SSL=${SSL:-true}
        - LEGACY_MODE=true
    ports:
      - "4884:4884"
      - "4885:4885"
    depends_on:
      - "lite-core-cbs"
